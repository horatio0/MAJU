<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        html, body {
                    height: 100%;
                    margin: 0;
                    padding: 0;
                    background: #f5f6fa;
                    font-size: 22px;
                    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                }
                .app-container {
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                }
                header {
                    height: 56px;
                    background: #5a6ef8;
                    color: #fff;
                    display: flex;
                    align-items: center;
                    justify-content: flex-start;
                    box-shadow: 0 2px 8px rgba(90,110,248,0.08);
                    padding-left: 16px;
                }
                main {
                    flex: 0.5;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }
                .main-content {
                    width: 100%;
                    max-width: 340px;
                    margin: 0 auto;
                    text-align: center;
                }
                h2 {
                    font-size: 2.5rem;
                    margin-bottom: 1vh;
                    width: 100%;
                    display: flex;
                    justify-content: flex-start;
                }
                .form-group {
                    margin-top: 20px;
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                    text-align: left;
                }
                label {
                    font-size: 0.95rem;
                    color: #5b6178;
                    margin-bottom: 5px;
                }
                input {
                    border: 1px solid #dfe6ff;
                    border-radius: 12px;
                    padding: 12px 14px;
                    font-size: 1.1rem;
                    transition: border 0.2s ease, box-shadow 0.2s ease;
                }
                input:focus {
                    outline: none;
                    border-color: #5a6ef8;
                    box-shadow: 0 0 0 3px rgba(90, 110, 248, 0.2);
                }
                .button-group {
                    margin-top: 40px;
                    display: flex;
                    flex-direction: column;
                    gap: 16px;
                }
                button {
                    border: none;
                    border-radius: 0.5em;
                    padding: 1em 2em;
                    font-size: 1.2rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: transform 0.1s, box-shadow 0.15s;
                    min-width: 140px;
                    min-height: 48px;
                }
                button:active {
                    transform: translateY(1px);
                }
                .loginButton {
                    background: linear-gradient(135deg, #5a6ef8, #9b63ff);
                    color: #fff;
                    box-shadow: 0 14px 28px rgba(96, 114, 255, 0.35);
                }
                .joinButton {
                    background: #f3f4f6;
                    color: #4b5563;
                }
                .status-box {
                    width: 100%;
                    min-height: 48px;
                    display: flex;
                    box-sizing: border-box;
                    padding: 0 10px;
                    margin-top: 10px;
                    margin-bottom: 20px;
                }
                .status {
                    width: 100%;
                    font-size: 0.95rem;
                    color: #6b7280;
                    word-break: break-all;
                }
                .status.error {
                    color: #e74c3c;
                }
                .status.success {
                    color: #2ecc71;
                }
                footer {
                    height: 48px;
                    background: #5a6ef8;
                    color: #fff;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 -2px 8px rgba(90,110,248,0.08);
                }
                .back-button {
                    background: none;
                    border: none;
                    font-size: 1.5rem;
                    cursor: pointer;
                    padding: 7%;
                    color: #333;
                    transition: color 0.2s;
                    flex-shrink: 0;
                }
                .back-button:hover {
                    color: #667eea;
                }
                .back {
                    display: flex;
                    justify-content: flex-start;
                    margin-bottom: 0;
                }         
    </style>
</head>

<body>
    <div class="app-container">
        <header ></header>
        <div class="back">
            <button class="back-button" onclick="window.location.href='index.html'">←</button>
        </div>
        <main>
            <div class="main-content">
                <h2 style="margin:0; font-size:3rem;">로그인</h2>
                <form id="loginForm" autocomplete="on">
                    <div class="form-group">
                        <label for="username">이메일</label>
                        <input id="username" name="username" type="text" placeholder="이메일을 입력하세요" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                    </div>
                    <div class="status-box">
                        <div class="status" id="status"></div>
                    </div>
                    <div class="button-group">
                        <button id="loginButton" class="loginButton" type="submit">로그인</button>
                        <button id="joinButton" class="joinButton" type="button">계정이 없어요</button>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <span style="font-size:1rem;">© 2025 MAJU</span>
        </footer>
    </div>

    <script>
        const loginButton = document.getElementById('loginButton');
        const joinButton = document.getElementById('joinButton');
        const userIdInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const statusLabel = document.getElementById('status');

        const setStatus = (message, type = '') => {
            statusLabel.textContent = message;
            statusLabel.className = `status ${type}`;
        };


        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = userIdInput.value.trim();
            const password = passwordInput.value.trim();

            if (!userId || !password) {
                setStatus('아이디와 비밀번호를 모두 입력하세요.', 'error');
                return;
            }

            setStatus('로그인 중입니다...');

            const email = userId;
            try {
                const response = await fetch('http://35.216.55.144:80/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const body = await response.json();
                localStorage.setItem('jwtToken', body.data);
                const { message, data } = body;

                if (!response.ok) {
                    // const errorBody = await response.json().catch(() => ({}));
                    // const message = errorBody?.message || `로그인 실패 (${response.status})`;
                    const errorMessage = `${message} (${response.status})` 
                    throw new Error(errorMessage);
                } else {
                    setStatus('로그인 성공! 대시보드로 이동합니다.', 'success');
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                setStatus(error.message, 'error');
            }
        });

        joinButton.addEventListener('click', () => {
            window.location.href = 'join.html';
        });
    </script>
</body>
</html>
