<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>MAJU</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 56px;
            background: #5a6ef8;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(90,110,248,0.08);
        }
        main {
            flex: 0.5;
            display: flex;
            /* align-items: center; */
            justify-content: center;
        }
        .main-content {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            text-align: center;
            align-items: center;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 1em 5em;
            font-size: 1.5rem;
            font-weight: 600;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: transform 0.1s;
            min-width: 140px;
            min-height: 48px;
        }
        button:active {
            transform: translateY(1px);
        }
        .loginButton {
            background: linear-gradient(135deg, #5a6ef8, #9b63ff);
            color: #fff;
            box-shadow: 0 14px 28px rgba(96, 114, 255, 0.35);
        }
        footer {
            height: 48px;
            background: #5a6ef8;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -2px 8px rgba(90,110,248,0.08);
        }
            </style>
        <body>
        <div class="app-container">
            <header>
            </header>
            <main>
                <div class="main-content">
                    <h1 style="margin-top:20%; font-size:5rem;">MAJU</h1>
                    <span style="font-size:1.5rem;">AI 면접 분석으로 취뽀하세요</span>
                    <img src="Gemini_Generated_Image_3r8lyy3r8lyy3r8l.png" alt="MAJU Logo" width="340" height="340" style="display:block; margin:20% auto; border-radius:24px;">
                    <div class="button-group">
                        <button id="login" class="loginButton">시작하기</button>
                    </div>
                </div>
            </main>
            <footer>
                <span style="font-size:1rem;">© 2025 MAJU</span>
            </footer>
        </div>
    <script>
        const login = document.getElementById('login');

        login.addEventListener('click', () => {
            window.location.href = "login.html"
        })
    </script>
</body>
</html>
