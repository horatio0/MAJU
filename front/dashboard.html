        main {
            align-items: center;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 32px 0;
        }
        .action-button {
            display: flex;
            /* flex-direction: column; */
            justify-content: space-between;
            gap: 24px;
            border: none;
            border-radius: 0.5em;
            padding: 1em 2em;
            /* font-size: 1.6rem; */
            font-weight: 600;
            color: #fff;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.15s;
            background: linear-gradient(135deg, #5a6ef8, #9b63ff);
            box-shadow: 0 14px 28px rgba(96, 114, 255, 0.15);
        }
        .action-button.secondary {
            background: #f3f4f6;
            color: #4b5563;
            box-shadow: none;
        }
        .action-button div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-button span {
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.85;
        }
        /* .action-button:active {
            transform: translateY(1px);
        } */
        h2 {
            font-size: 1.5rem;
            margin-bottom: 10%;
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }
        h3 {
            margin: 0;
            padding: auto 0;
        }
        /* footer {
            height: 48px;
            background: #5a6ef8;
            color: #fff;
            display: flex;

<body>
    <div class="phone-mockup-wrapper">
    <div class="app-container">
        <header></header>
        <main>
            <div class="main-content">
                <h2>👋 안녕하세요, MAJU님</h2>
                <section class="actions">
                    <button class="action-button" data-link="questions.html">
                        <div>
                            <h3>면접 연습하기</h3>
                            <span>유형별 면접 대비</span>
                        </div>
                        <span style="font-size: 2.5rem;">🚀</span>
                    </button>
                    <button class="action-button secondary" data-link="history.html">
                        <div>
                            <h3>히스토리</h3>
                            <span>결과 다시 보기</span>
                        </div>
                        <span style="font-size: 2.5rem;">📑</span>
                    </button>
                    <button class="action-button secondary" id="myPageBtn">
                        <div>
                            <h3>내 정보</h3>   
                        </div>
                        <span style="font-size: 2.5rem;">👤</span>
                    </button>

                    <a id="logoutButton" style="color: #4b5563; cursor: pointer;">로그아웃</a>
                </section>
            </div>
        </main>
        <footer>
            <span>MAJU Interview Assistant</span>
            <span>v0.1.0</span>
        </footer>
    </div>
    </div>

    <script>
        document.querySelectorAll('.action-button').forEach((button) => {
            button.addEventListener('click', () => {
                const link = button.dataset.link;
                if (link) {
                    window.location.href = link;
                }
            });
        });


        // IndexedDB + sessionStorage 초기화 임시 버튼
        document.getElementById('myPageBtn').addEventListener('click', () => {
            window.location.href = 'myPage.html';
        });

        document.getElementById('logoutButton').addEventListener('click', () => {
            // TODO: 필요 시 토큰 삭제 등 로그아웃 처리 추가
            window.location.href = 'login.html';
        });
    </script>
</body>
