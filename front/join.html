<body>
    <div class="app-container">
        <header></header>
        <div class="back">
            <button class="back-button" onclick="window.location.href='index.html'">←</button>
        </div>
        <main>
            <div class="main-content">
                <h2>계정 만들기</h2>
                <div class="form-group">
                    <label for="username">이메일</label>
                    <input id="username" type="text" placeholder="이메일을 입력하세요" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input id="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password">
                </div>
                <div class="status-box">
                    <div class="status" id="status"></div>
                </div>
                <div class="button-group">
                    <button id="createButton" class="createButton">계정 생성하기</button>
                    <button id="cancelButton" class="cancelButton">취소</button>
                </div>
            </div>
        </main>
        <footer>

        </footer>
    </div>

    <script>
        const createAccountButton = document.getElementById('createButton');
        const cancelButton = document.getElementById('cancelButton');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const statusLabel = document.getElementById('status');

        const setStatus = (message, type = '') => {
            statusLabel.textContent = message;
            statusLabel.className = `status ${type}`;
        };

        createAccountButton.addEventListener('click', async () => {
            const userId = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!userId || !password) {
                setStatus('아이디와 비밀번호를 모두 입력하세요.', 'error');
                return;
            }

            if (password.length < 4) {
                setStatus('비밀번호는 4자 이상이어야 합니다.', 'error');
                return;
            }

            setStatus('계정 생성 중입니다...');

            const email = userId;
            try {
                const response = await fetch('http://35.216.55.144:80/api/auth/register', {
                    
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password, name, email}),
                });

                const body = await response.json();
                const { message, data } = body;

                if (!response.ok) {
                    // const errorBody = await response.json().catch(() => ({}));
                    // const message = errorBody?.message || `로그인 실패 (${response.status})`;
                    const errorMessage = `${message} (${response.status})` 
                    throw new Error(errorMessage);
                }

                else {
                    setStatus('계정이 생성되었습니다. 로그인 페이지로 이동합니다.', 'success');
                    window.location.href = 'login.html';

                }          
            } catch (error) {
                setStatus(error.message, 'error');
            }
        });

        cancelButton.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
