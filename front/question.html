<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 확인 및 답변 준비 페이지</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 22px;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 56px;
            background: #5a6ef8;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-shadow: 0 2px 8px rgba(90,110,248,0.08);
            padding-left: 16px;
        }
        main {
            flex: 0.75;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .back {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 0;
        }
        .back-button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 7%;
            color: #333;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .back-button:hover {
            color: #667eea;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #000;
            width: 100%;
            /* max-width: 340px; */
            margin: 0 auto;
            text-align: center;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1vh;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        p {
            margin: 10%;
        }

        .button-group {
            margin-top: 50%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 1em 0.5em;
            font-size: 0.5rem;
            font-weight: 600;
            border: none;
            border-radius: 0.5em;
            cursor: pointer;
            transition: transform 0.1s;
            min-width: 140px;
            min-height: 48px;
        }

        footer {
            height: 48px;
            background: #5a6ef8;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -2px 8px rgba(90,110,248,0.08);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header></header>
        <div class="back">
            <button class="back-button" onclick="window.location.href='dashboard.html'">←</button> 
        </div>
        <main>
            <div class="main-content">
                <h2>질문 1</h2>
                <p>웹브라우저에서 www.google.com에 접속하는 과정을 아는 대로 설명하세요</p>
                <div>
                    <button id="startButton">바로 답변하기</button>
                    <button id="stopButton">면접 중지</button>
                </div>
            </div>
        </main>
        <footer>
            <span>MAJU Interview Assistant</span>
            <span>v0.1.0</span>
        </footer>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const questionTitle = document.querySelector('h2');
        const questionText = document.querySelector('p');

        // 선택된 질문 목록과 현재 인덱스 가져오기
        const selectedQuestions = JSON.parse(sessionStorage.getItem('selectedQuestions') || '[]');
        const currentIndex = parseInt(sessionStorage.getItem('currentQuestionIndex') || '0');

        // 현재 질문 표시
        if (selectedQuestions.length > 0 && currentIndex < selectedQuestions.length) {
            const currentQuestion = selectedQuestions[currentIndex];
            questionTitle.textContent = `질문 ${currentIndex + 1}`;
            questionText.textContent = currentQuestion.title;
        } else {
            // 질문이 없으면 대시보드로 이동
            alert('선택된 질문이 없습니다.');
            window.location.href = 'dashboard.html';
        }

        startButton.addEventListener('click', () => {
            window.location.href = 'answer.html';
        });

        stopButton.addEventListener('click', () => {
            // 면접 중지 시 대시보드로 이동
            sessionStorage.removeItem('selectedQuestions');
            sessionStorage.removeItem('currentQuestionIndex');
            window.location.href = 'dashboard.html';
        });

    </script>
</body>
</html>
