<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>답변 녹화 페이지</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /* html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 22px;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }*/

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .question-box {
            margin-bottom: 40px;
            width: 80%;
            max-width: 800px;
        }

        .question-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .timer-box {
            font-size: 4rem;
            font-weight: 800;
            color: #5a6ef8;
            margin: 30px 0;
        }

        .status-text {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 20px;
        }

        .upload-section {
            display: none; /* 초기에는 숨김 */
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5a6ef8, #9b63ff);
            color: #fff;
            box-shadow: 0 4px 12px rgba(90, 110, 248, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(90, 110, 248, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #495057;
        }

        .progress-bar {
            width: 100%;
            max-width: 600px;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #5a6ef8;
            width: 0%;
            transition: width 1s linear;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="question-box">
            <div class="status-text" id="statusText">질문을 읽고 답변을 준비하세요</div>
            <div class="question-text" id="questionText">질문 로딩 중...</div>
        </div>

        <div class="timer-box" id="timer">30</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button id="skipBtn" class="btn btn-secondary" style="margin-top: 30px;">건너뛰기</button>

        <div class="upload-section" id="uploadSection">
            <h3>답변 시간이 종료되었습니다.</h3>
            <p>녹화한 답변 영상을 업로드해주세요.</p>
            
            <input type="file" id="videoInput" accept="video/*" style="display: none;">
            <button class="btn btn-primary" onclick="document.getElementById('videoInput').click()">영상 선택하기</button>
            <div id="fileName" style="margin-top: 10px; color: #666;"></div>
            
            <button class="btn btn-primary" id="uploadBtn" style="display: none; margin-top: 20px;">분석 시작하기</button>
        </div>
    </div>

    <script>
        // 상태 상수
        const STATE_READING = 'READING'; // 30초
        const STATE_ANSWERING = 'ANSWERING'; // 60초
        const STATE_UPLOAD = 'UPLOAD';

        let currentState = STATE_READING;
        let timeLeft = 30;
        let timerInterval;

        const statusText = document.getElementById('statusText');
        const questionText = document.getElementById('questionText');
        const timerDisplay = document.getElementById('timer');
        const progressFill = document.getElementById('progressFill');
        const uploadSection = document.getElementById('uploadSection');
        const skipBtn = document.getElementById('skipBtn');
        const videoInput = document.getElementById('videoInput');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');

        // 초기화
        function init() {
            // 질문 가져오기 (sessionStorage 또는 임시 데이터)
            const questions = JSON.parse(sessionStorage.getItem('selectedQuestions') || '[]');
            const currentIndex = parseInt(sessionStorage.getItem('currentQuestionIndex') || '0');
            
            // 질문 데이터가 없으면 임시 질문 표시
            if (questions.length > 0 && questions[currentIndex]) {
                // 실제 데이터 구조에 맞게 수정 필요 (여기서는 id만 있다고 가정하고 텍스트는 임의로)
                // 실제로는 questions 배열에 title이 포함되어 있어야 함.
                // 앞선 questions.html 코드를 보면 {id, title} 객체로 저장됨.
                // 하지만 sessionStorage에는 ID 목록만 저장될 수도 있음. 확인 필요.
                // 여기서는 안전하게 처리
                questionText.textContent = questions[currentIndex].title || "질문 내용이 없습니다.";
            } else {
                questionText.textContent = "자기소개를 해주세요 (예시)";
            }

            startTimer(30);
        }

        function startTimer(seconds) {
            timeLeft = seconds;
            const totalTime = seconds;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                // 진행바 업데이트
                const percentage = ((totalTime - timeLeft) / totalTime) * 100;
                progressFill.style.width = `${percentage}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimerEnd();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function handleTimerEnd() {
            if (currentState === STATE_READING) {
                // 읽기 시간 종료 -> 답변 시간 시작
                currentState = STATE_ANSWERING;
                statusText.textContent = "답변을 시작하세요!";
                statusText.style.color = "#e74c3c";
                timerDisplay.style.color = "#e74c3c";
                progressFill.style.backgroundColor = "#e74c3c";
                startTimer(60); // 1분
            } else if (currentState === STATE_ANSWERING) {
                // 답변 시간 종료 -> 다음 질문 또는 업로드 모드
                
                const questions = JSON.parse(sessionStorage.getItem('selectedQuestions') || '[]');
                let currentIndex = parseInt(sessionStorage.getItem('currentQuestionIndex') || '0');

                if (currentIndex < questions.length - 1) {
                    // 다음 질문으로 이동
                    currentIndex++;
                    sessionStorage.setItem('currentQuestionIndex', currentIndex.toString());
                    
                    // 상태 초기화 및 다음 질문 표시
                    currentState = STATE_READING;
                    statusText.textContent = "질문을 읽고 답변을 준비하세요";
                    statusText.style.color = "#666";
                    timerDisplay.style.color = "#5a6ef8";
                    progressFill.style.backgroundColor = "#5a6ef8";
                    
                    questionText.textContent = questions[currentIndex].title || "질문 내용이 없습니다.";
                    
                    startTimer(30);
                } else {
                    // 모든 질문 종료 -> 업로드 모드
                    currentState = STATE_UPLOAD;
                    statusText.textContent = "모든 면접 질문이 종료되었습니다.";
                    questionText.textContent = "수고하셨습니다!";
                    timerDisplay.style.display = 'none';
                    document.querySelector('.progress-bar').style.display = 'none';
                    skipBtn.style.display = 'none';
                    uploadSection.style.display = 'flex';
                }
            }
        }

        // 스킵 버튼 처리
        skipBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            handleTimerEnd();
        });

        // 파일 선택 처리
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = `선택된 파일: ${file.name}`;
                uploadBtn.style.display = 'inline-block';
            }
        });

        // 업로드 및 분석 요청
        uploadBtn.addEventListener('click', async () => {
            const file = videoInput.files[0];
            if (!file) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = "업로드 중...";
            statusText.textContent = "영상을 업로드하고 있습니다.";

            const formData = new FormData();
            formData.append('file', file);

            try {
                // JWT 토큰 가져오기
                const token = localStorage.getItem('jwtToken');
                
                // 백엔드에 파일 업로드 및 작업 ID 받기
                const response = await fetch('http://35.216.55.144:80/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`업로드 실패: ${response.status}`);
                }

                const result = await response.json();
                
                // taskId를 localStorage에 저장
                if (result.data && result.data.taskId) {
                    localStorage.setItem('currentTaskId', result.data.taskId);
                    localStorage.setItem('taskStatus', result.data.status);
                    
                    // history.html로 리다이렉트
                    window.location.href = 'history.html';
                } else {
                    throw new Error('작업 ID를 받지 못했습니다.');
                }

            } catch (error) {
                console.error(error);
                alert('업로드 중 오류가 발생했습니다: ' + error.message);
                uploadBtn.disabled = false;
                uploadBtn.textContent = "분석 시작하기";
            }
        });

        // 시작
        init();
    </script>
</body>
</html>
